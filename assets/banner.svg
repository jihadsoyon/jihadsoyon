<svg width="1280" height="320" viewBox="0 0 1280 320" xmlns="http://www.w3.org/2000/svg">

  <defs>
    <!-- Background: same family as README (0F2027 -> 17364A -> 1F4E68) but richer -->
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="320">
      <stop offset="0%" stop-color="#060D12"/>
      <stop offset="30%" stop-color="#0F2027"/>
      <stop offset="65%" stop-color="#17364A"/>
      <stop offset="100%" stop-color="#1F4E68"/>
    </linearGradient>

    <!-- Spotlight glow behind name, same cyan family -->
    <radialGradient id="spotlight" cx="50%" cy="42%" r="55%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>

    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Grid, same as original but slightly stronger -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#38BDF8" stroke-opacity="0.09"/>
    </pattern>

    <pattern id="diagLines" width="60" height="60" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="60" stroke="#38BDF8" stroke-opacity="0.045" stroke-width="2"/>
    </pattern>

    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0EA5E9" stop-opacity="0"/>
      <stop offset="15%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#7DD3FC"/>
      <stop offset="85%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0EA5E9" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="nameFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#E6F7FF"/>
      <stop offset="100%" stop-color="#7DD3FC"/>
    </linearGradient>

    <linearGradient id="badgeFill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0EA5E9"/>
    </linearGradient>
  </defs>

  <!-- Background layers -->
  <rect width="1280" height="320" fill="url(#bg)"/>
  <rect width="1280" height="320" fill="url(#diagLines)"/>
  <rect width="1280" height="320" fill="url(#grid)"/>
  <rect width="1280" height="320" fill="url(#spotlight)"/>

  <!-- Orbit rings, subtle, cyan only -->
  <circle cx="640" cy="160" r="235" fill="none" stroke="#38BDF8" stroke-opacity="0.14" stroke-width="1">
    <animateTransform attributeName="transform" type="rotate" from="0 640 160" to="360 640 160" dur="35s" repeatCount="indefinite"/>
  </circle>
  <circle cx="640" cy="160" r="262" fill="none" stroke="#7DD3FC" stroke-opacity="0.10" stroke-width="1" stroke-dasharray="5 9">
    <animateTransform attributeName="transform" type="rotate" from="360 640 160" to="0 640 160" dur="45s" repeatCount="indefinite"/>
  </circle>

  <!-- Corner brackets, techy frame, all cyan -->
  <path d="M40 40 L40 80 M40 40 L80 40" stroke="#38BDF8" stroke-width="2.5" fill="none" opacity="0.85"/>
  <path d="M1240 40 L1240 80 M1240 40 L1200 40" stroke="#38BDF8" stroke-width="2.5" fill="none" opacity="0.85"/>
  <path d="M40 280 L40 240 M40 280 L80 280" stroke="#38BDF8" stroke-width="2.5" fill="none" opacity="0.85"/>
  <path d="M1240 280 L1240 240 M1240 280 L1200 280" stroke="#38BDF8" stroke-width="2.5" fill="none" opacity="0.85"/>

  <!-- Top / Bottom lines -->
  <rect x="80" y="52" width="1120" height="2.5" fill="url(#accent)" opacity=".9"/>
  <rect x="80" y="270" width="1120" height="2.5" fill="url(#accent)" opacity=".9"/>

  <!-- Particles -->
  <circle cx="120" cy="120" r="4" fill="#38BDF8">
    <animate attributeName="opacity" values="1;.25;1" dur="2.3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1160" cy="120" r="4" fill="#7DD3FC">
    <animate attributeName="opacity" values=".25;1;.25" dur="2.3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="150" cy="222" r="3" fill="#7DD3FC">
    <animate attributeName="opacity" values=".3;1;.3" dur="1.9s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1130" cy="222" r="3" fill="#38BDF8">
    <animate attributeName="opacity" values="1;.3;1" dur="1.9s" repeatCount="indefinite"/>
  </circle>
  <circle cx="640" cy="66" r="3.5" fill="#38BDF8">
    <animate attributeName="opacity" values=".25;1;.25" dur="2.7s" repeatCount="indefinite"/>
  </circle>

  <!-- Status badge -->
  <g filter="url(#softGlow)">
    <rect x="530" y="60" width="220" height="26" rx="13" fill="#0B1A22" stroke="url(#badgeFill)" stroke-width="1.4"/>
    <circle cx="548" cy="73" r="4" fill="#38BDF8">
      <animate attributeName="opacity" values="1;.3;1" dur="1.4s" repeatCount="indefinite"/>
    </circle>
    <text x="564" y="78" font-size="12.5" font-family="Consolas, monospace" fill="#DFF4FF" letter-spacing="1">OPEN TO NEW PROJECTS</text>
  </g>

  <!-- Name -->
  <text
      x="640"
      y="162"
      text-anchor="middle"
      font-size="62"
      font-family="Inter, Segoe UI, sans-serif"
      font-weight="800"
      fill="url(#nameFill)"
      filter="url(#glow)"
      letter-spacing="2">

      JIHAD SOYON

  </text>

  <!-- Title -->
  <text
      x="640"
      y="202"
      text-anchor="middle"
      font-size="23"
      font-family="Inter, Segoe UI, sans-serif"
      font-weight="600"
      fill="#38BDF8"
      filter="url(#softGlow)"
      letter-spacing="1">

      Full Stack Developer

  </text>

  <!-- small diamond dividers around title -->
  <path d="M478 197 l6 -6 l6 6 l-6 6 z" fill="#38BDF8" opacity="0.8"/>
  <path d="M790 197 l6 -6 l6 6 l-6 6 z" fill="#38BDF8" opacity="0.8"/>

  <!-- Stack -->
  <text
      x="640"
      y="237"
      text-anchor="middle"
      font-size="17"
      font-family="Consolas, monospace"
      fill="#C9D1D9"
      letter-spacing="0.5">

      Next.js • React • Express • MongoDB • PostgreSQL

  </text>

  <!-- tiny tagline -->
  <text x="640" y="257" text-anchor="middle" font-size="12" font-family="Inter, Segoe UI, sans-serif" fill="#5B8BA0" letter-spacing="2.5">
    CODE • DEBUG • DEPLOY • REPEAT
  </text>

</svg>