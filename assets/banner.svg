

<svg width="1280" height="320" viewBox="0 0 1280 320" xmlns="http://www.w3.org/2000/svg">

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="320">
      <stop offset="0%" stop-color="#060D12"/>
      <stop offset="30%" stop-color="#0F2027"/>
      <stop offset="65%" stop-color="#17364A"/>
      <stop offset="100%" stop-color="#1F4E68"/>
    </linearGradient>

    <radialGradient id="spotlight" cx="50%" cy="42%" r="55%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>

    <!-- Planet body -->
    <radialGradient id="planetBody" cx="38%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#8FE3FF"/>
      <stop offset="35%" stop-color="#38BDF8"/>
      <stop offset="70%" stop-color="#155E86"/>
      <stop offset="100%" stop-color="#082B3E"/>
    </radialGradient>

    <radialGradient id="planetGlow" cx="50%" cy="50%" r="50%">
      <stop offset="60%" stop-color="#38BDF8" stop-opacity="0"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.25"/>
    </radialGradient>

    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="planetBlur" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <filter id="iconGlow" x="-120%" y="-120%" width="340%" height="340%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#38BDF8" stroke-opacity="0.09"/>
    </pattern>
    <pattern id="diagLines" width="60" height="60" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="60" stroke="#38BDF8" stroke-opacity="0.045" stroke-width="2"/>
    </pattern>

    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0EA5E9" stop-opacity="0"/>
      <stop offset="15%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#7DD3FC"/>
      <stop offset="85%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0EA5E9" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="nameFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#E6F7FF"/>
      <stop offset="100%" stop-color="#7DD3FC"/>
    </linearGradient>

    <linearGradient id="badgeFill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0EA5E9"/>
    </linearGradient>

    <!-- Nebula wash (subtle cosmic dust) -->
    <radialGradient id="nebulaCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nebulaPurple" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#A78BFA" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#A78BFA" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nebulaPink" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F472B6" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#F472B6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1280" height="320" fill="url(#bg)"/>
  <rect width="1280" height="320" fill="url(#diagLines)"/>
  <rect width="1280" height="320" fill="url(#grid)"/>
  <rect width="1280" height="320" fill="url(#spotlight)"/>

  <!-- ===== Nebula cosmic dust (very subtle color wash) ===== -->
  <ellipse cx="180" cy="130" rx="240" ry="150" fill="url(#nebulaCyan)"/>
  <ellipse cx="1080" cy="180" rx="260" ry="160" fill="url(#nebulaPurple)"/>
  <ellipse cx="900" cy="60" rx="200" ry="110" fill="url(#nebulaPink)"/>

  <!-- ===== Parallax star layers ===== -->
  <!-- far layer: tiny, dim, slow -->
  <g opacity="0.55">
    <circle cx="60" cy="90" r="0.9" fill="#DFF4FF"><animate attributeName="opacity" values="0.15;0.5;0.15" dur="5s" repeatCount="indefinite"/></circle>
    <circle cx="330" cy="45" r="0.9" fill="#DFF4FF"><animate attributeName="opacity" values="0.5;0.15;0.5" dur="4.6s" repeatCount="indefinite"/></circle>
    <circle cx="420" cy="270" r="0.9" fill="#DFF4FF"><animate attributeName="opacity" values="0.15;0.45;0.15" dur="5.4s" repeatCount="indefinite"/></circle>
    <circle cx="850" cy="290" r="0.9" fill="#DFF4FF"><animate attributeName="opacity" values="0.45;0.15;0.45" dur="4.8s" repeatCount="indefinite"/></circle>
    <circle cx="1230" cy="90" r="0.9" fill="#DFF4FF"><animate attributeName="opacity" values="0.15;0.5;0.15" dur="5.2s" repeatCount="indefinite"/></circle>
    <circle cx="960" cy="30" r="0.9" fill="#DFF4FF"><animate attributeName="opacity" values="0.5;0.2;0.5" dur="4.4s" repeatCount="indefinite"/></circle>
  </g>
  <!-- near layer: slightly bigger, brighter, faster twinkle -->
  <g opacity="0.7">
    <circle cx="230" cy="55" r="1.3" fill="#DFF4FF"><animate attributeName="opacity" values="0.2;0.8;0.2" dur="3.4s" repeatCount="indefinite"/></circle>
    <circle cx="1000" cy="240" r="1.3" fill="#DFF4FF"><animate attributeName="opacity" values="0.7;0.15;0.7" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="90" cy="180" r="1.1" fill="#DFF4FF"><animate attributeName="opacity" values="0.15;0.65;0.15" dur="3.9s" repeatCount="indefinite"/></circle>
    <circle cx="1210" cy="150" r="1.2" fill="#DFF4FF"><animate attributeName="opacity" values="0.6;0.1;0.6" dur="3.1s" repeatCount="indefinite"/></circle>
    <circle cx="500" cy="35" r="1.1" fill="#DFF4FF"><animate attributeName="opacity" values="0.2;0.7;0.2" dur="3.6s" repeatCount="indefinite"/></circle>
    <circle cx="760" cy="280" r="1.1" fill="#DFF4FF"><animate attributeName="opacity" values="0.65;0.2;0.65" dur="3.2s" repeatCount="indefinite"/></circle>
  </g>

  <!-- ===== Distant background planets (far corners, subtle depth) ===== -->
  <g opacity="0.5">
    <!-- top-left small planet -->
    <circle cx="150" cy="70" r="22" fill="url(#planetBody)" opacity="0.35" filter="url(#planetBlur)"/>
    <circle cx="150" cy="70" r="16" fill="url(#planetBody)" opacity="0.55"/>
    <ellipse cx="150" cy="70" rx="27" ry="7" fill="none" stroke="#7DD3FC" stroke-opacity="0.3" stroke-width="1.2" transform="rotate(-18 150 70)"/>
  </g>

  <g opacity="0.4">
    <!-- bottom-right small planet, slightly purple tint -->
    <circle cx="1145" cy="255" r="17" fill="#A78BFA" opacity="0.28" filter="url(#planetBlur)"/>
    <circle cx="1145" cy="255" r="11" fill="#A78BFA" opacity="0.45"/>
    <ellipse cx="1145" cy="255" rx="21" ry="6" fill="none" stroke="#C4B5FD" stroke-opacity="0.3" stroke-width="1" transform="rotate(12 1145 255)"/>
  </g>

  <g opacity="0.35">
    <!-- tiny distant moon, top-right -->
    <circle cx="1095" cy="55" r="8" fill="#7DD3FC" opacity="0.5"/>
    <circle cx="1095" cy="55" r="8" fill="url(#planetBody)" opacity="0.4"/>
  </g>

  <g opacity="0.3">
    <!-- tiny distant moon, bottom-left -->
    <circle cx="185" cy="248" r="6" fill="#38BDF8" opacity="0.5"/>
  </g>

  <!-- ===== Background Planet (sits behind everything) ===== -->
  <g opacity="0.9">
    <!-- outer ambient glow -->
    <circle cx="640" cy="160" r="130" fill="url(#planetGlow)"/>

    <!-- tilted ring behind planet -->
    <ellipse cx="640" cy="160" rx="150" ry="34" fill="none" stroke="#7DD3FC" stroke-opacity="0.35" stroke-width="2" transform="rotate(-14 640 160)"/>

    <!-- planet sphere -->
    <circle cx="640" cy="160" r="78" fill="url(#planetBody)" opacity="0.55" filter="url(#planetBlur)"/>
    <circle cx="640" cy="160" r="78" fill="url(#planetBody)" opacity="0.30"/>

    <!-- surface arcs for texture -->
    <path d="M568 140 Q640 165 712 138" stroke="#0B2C40" stroke-opacity="0.35" stroke-width="3" fill="none"/>
    <path d="M572 176 Q640 196 708 172" stroke="#0B2C40" stroke-opacity="0.3" stroke-width="2.5" fill="none"/>

    <!-- ring in front of planet -->
    <ellipse cx="640" cy="160" rx="150" ry="34" fill="none" stroke="#BEEBFF" stroke-opacity="0.45" stroke-width="2" stroke-dasharray="2 5" transform="rotate(-14 640 160)"/>

    <!-- slow planet rotation glint -->
    <ellipse cx="620" cy="140" rx="18" ry="10" fill="#FFFFFF" opacity="0.18">
      <animate attributeName="opacity" values="0.1;0.28;0.1" dur="5s" repeatCount="indefinite"/>
    </ellipse>
  </g>

  <!-- Small moon orbiting the main planet -->
  <g opacity="0.85">
    <animateTransform attributeName="transform" type="rotate" from="0 640 160" to="360 640 160" dur="14s" repeatCount="indefinite"/>
    <circle cx="640" cy="97" r="6" fill="#DCEFFF"/>
    <circle cx="640" cy="97" r="6" fill="url(#planetBody)" opacity="0.35"/>
    <circle cx="642.5" cy="95" r="1.6" fill="#0B2C40" opacity="0.4"/>
  </g>

  <!-- Subtle asteroid belt around the planet -->
  <g opacity="0.5">
    <animateTransform attributeName="transform" type="rotate" from="0 640 160" to="360 640 160" dur="40s" repeatCount="indefinite"/>
    <circle cx="640" cy="55" r="1.4" fill="#9FD9F5"/>
    <circle cx="678" cy="60" r="1" fill="#9FD9F5"/>
    <circle cx="712" cy="75" r="1.3" fill="#9FD9F5"/>
    <circle cx="734" cy="98" r="0.9" fill="#9FD9F5"/>
    <circle cx="600" cy="58" r="1.1" fill="#9FD9F5"/>
    <circle cx="565" cy="76" r="1.3" fill="#9FD9F5"/>
    <circle cx="545" cy="100" r="0.9" fill="#9FD9F5"/>
    <circle cx="745" cy="130" r="1" fill="#9FD9F5"/>
    <circle cx="535" cy="130" r="1.1" fill="#9FD9F5"/>
  </g>

  <!-- Orbit guide rings (very faint) -->
  <circle cx="640" cy="160" r="205" fill="none" stroke="#38BDF8" stroke-opacity="0.10" stroke-width="1"/>
  <circle cx="640" cy="160" r="252" fill="none" stroke="#7DD3FC" stroke-opacity="0.08" stroke-width="1" stroke-dasharray="4 8"/>

  <!-- ===== Orbiting Tech Logos ===== -->

  <!-- React -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 640 160" to="360 640 160" dur="22s" repeatCount="indefinite"/>
    <g transform="translate(640,-45)" filter="url(#glowReact)">
      <g stroke="#61DAFB" stroke-width="1.8" fill="none">
        <ellipse rx="13" ry="5.2"/>
        <ellipse rx="13" ry="5.2" transform="rotate(60)"/>
        <ellipse rx="13" ry="5.2" transform="rotate(120)"/>
      </g>
      <circle r="2.6" fill="#61DAFB"/>
    </g>
  </g>

  <!-- Node.js -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="130 640 160" to="490 640 160" dur="26s" repeatCount="indefinite"/>
    <g transform="translate(640,-205)" filter="url(#glowNode)">
      <path d="M0,-11 L9.5,-5.5 L9.5,5.5 L0,11 L-9.5,5.5 L-9.5,-5.5 Z" fill="#0B1A22" stroke="#8CC84B" stroke-width="1.6"/>
      <text x="0" y="4" text-anchor="middle" font-family="Consolas, monospace" font-size="9" fill="#8CC84B" font-weight="700">JS</text>
    </g>
  </g>

  <!-- TypeScript -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="230 640 160" to="590 640 160" dur="19s" repeatCount="indefinite"/>
    <g transform="translate(640,-205)" filter="url(#glowTS)">
      <rect x="-11" y="-11" width="22" height="22" rx="4" fill="#0B1A22" stroke="#3178C6" stroke-width="1.6"/>
      <text x="0" y="5" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#3178C6" font-weight="700">TS</text>
    </g>
  </g>

  <!-- MongoDB -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="60 640 160" to="420 640 160" dur="24s" repeatCount="indefinite"/>
    <g transform="translate(640,-45)" filter="url(#glowMongo)">
      <path d="M0,-12 C7,-6 7,7 0,13 C-7,7 -7,-6 0,-12 Z" fill="#0B1A22" stroke="#4DB33D" stroke-width="1.6"/>
      <line x1="0" y1="13" x2="0" y2="17" stroke="#4DB33D" stroke-width="1.6"/>
    </g>
  </g>

  <!-- Express -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="300 640 160" to="660 640 160" dur="21s" repeatCount="indefinite"/>
    <g transform="translate(640,-205)" filter="url(#iconGlow)">
      <circle r="12" fill="#0B1A22" stroke="#C9D1D9" stroke-width="1.6"/>
      <text x="0" y="4" text-anchor="middle" font-family="Consolas, monospace" font-size="10" fill="#C9D1D9" font-weight="700">Ex</text>
    </g>
  </g>

  <!-- Tailwind -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="20 640 160" to="-340 640 160" dur="28s" repeatCount="indefinite"/>
    <g transform="translate(640,-45)" filter="url(#iconGlow)">
      <path d="M-11,-2 C-8,-9 -1,-9 2,-4 C4,-1 5,1 8,1 C5,1 3,-2 0,-2 C-3,-2 -4,0 -6,1 M-11,4 C-8,-3 -1,-3 2,2 C4,5 5,7 8,7 C5,7 3,4 0,4 C-3,4 -4,6 -6,7"
        stroke="#38BDF8" stroke-width="1.6" fill="none" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Corner brackets -->
  <path d="M40 40 L40 80 M40 40 L80 40" stroke="#38BDF8" stroke-width="2.5" fill="none" opacity="0.85"/>
  <path d="M1240 40 L1240 80 M1240 40 L1200 40" stroke="#38BDF8" stroke-width="2.5" fill="none" opacity="0.85"/>
  <path d="M40 280 L40 240 M40 280 L80 280" stroke="#38BDF8" stroke-width="2.5" fill="none" opacity="0.85"/>
  <path d="M1240 280 L1240 240 M1240 280 L1200 280" stroke="#38BDF8" stroke-width="2.5" fill="none" opacity="0.85"/>

  <!-- Top / Bottom lines -->
  <rect x="80" y="52" width="1120" height="2.5" fill="url(#accent)" opacity=".9"/>
  <rect x="80" y="270" width="1120" height="2.5" fill="url(#accent)" opacity=".9"/>

  <!-- Particles -->
  <circle cx="120" cy="120" r="4" fill="#38BDF8"><animate attributeName="opacity" values="1;.25;1" dur="2.3s" repeatCount="indefinite"/></circle>
  <circle cx="1160" cy="120" r="4" fill="#7DD3FC"><animate attributeName="opacity" values=".25;1;.25" dur="2.3s" repeatCount="indefinite"/></circle>
  <circle cx="150" cy="222" r="3" fill="#7DD3FC"><animate attributeName="opacity" values=".3;1;.3" dur="1.9s" repeatCount="indefinite"/></circle>
  <circle cx="1130" cy="222" r="3" fill="#38BDF8"><animate attributeName="opacity" values="1;.3;1" dur="1.9s" repeatCount="indefinite"/></circle>
  <circle cx="640" cy="66" r="3.5" fill="#38BDF8"><animate attributeName="opacity" values=".25;1;.25" dur="2.7s" repeatCount="indefinite"/></circle>

  <!-- Status badge -->
  <g filter="url(#softGlow)">
    <rect x="530" y="60" width="220" height="26" rx="13" fill="#0B1A22" stroke="url(#badgeFill)" stroke-width="1.4"/>
    <circle cx="548" cy="73" r="4" fill="#38BDF8">
      <animate attributeName="opacity" values="1;.3;1" dur="1.4s" repeatCount="indefinite"/>
    </circle>
    <text x="564" y="78" font-size="12.5" font-family="Consolas, monospace" fill="#DFF4FF" letter-spacing="1">OPEN TO NEW PROJECTS</text>
  </g>

  <!-- Name -->
  <text x="640" y="162" text-anchor="middle" font-size="62" font-family="Inter, Segoe UI, sans-serif" font-weight="800" fill="url(#nameFill)" filter="url(#glow)" letter-spacing="2">
    JIHAD SOYON
  </text>

  <!-- Title -->
  <text x="640" y="202" text-anchor="middle" font-size="23" font-family="Inter, Segoe UI, sans-serif" font-weight="600" fill="#38BDF8" filter="url(#softGlow)" letter-spacing="1">
    Mern Stack Developer
  </text>

  <path d="M478 197 l6 -6 l6 6 l-6 6 z" fill="#38BDF8" opacity="0.8"/>
  <path d="M790 197 l6 -6 l6 6 l-6 6 z" fill="#38BDF8" opacity="0.8"/>

  <!-- Stack -->
  <text x="640" y="237" text-anchor="middle" font-size="17" font-family="Consolas, monospace" fill="#C9D1D9" letter-spacing="0.5">
    Next.js • React • Express • MongoDB • PostgreSQL
  </text>

  <!-- tagline -->
  <text x="640" y="257" text-anchor="middle" font-size="12" font-family="Inter, Segoe UI, sans-serif" fill="#5B8BA0" letter-spacing="2.5">
    CODE • DEBUG • DEPLOY • REPEAT
  </text>

</svg>