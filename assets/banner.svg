<svg width="1280" height="320" viewBox="0 0 1280 320" xmlns="http://www.w3.org/2000/svg">

  <defs>
    <!-- Background -->
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="320">
      <stop offset="0%" stop-color="#0F2027"/>
      <stop offset="50%" stop-color="#17364A"/>
      <stop offset="100%" stop-color="#1F4E68"/>
    </linearGradient>

    <!-- Glow -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Grid -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#38BDF8" stroke-opacity="0.08"/>
    </pattern>

    <!-- Accent -->
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0EA5E9"/>
    </linearGradient>

  </defs>

  <!-- Background -->
  <rect width="1280" height="320" fill="url(#bg)"/>
  <rect width="1280" height="320" fill="url(#grid)"/>

  <!-- Top Line -->
  <rect x="80" y="55" width="1120" height="2" fill="url(#accent)" opacity=".8"/>

  <!-- Bottom Line -->
  <rect x="80" y="265" width="1120" height="2" fill="url(#accent)" opacity=".8"/>

  <!-- Left Decoration -->
  <circle cx="120" cy="160" r="5" fill="#38BDF8">
    <animate attributeName="opacity"
             values="1;.3;1"
             dur="2.5s"
             repeatCount="indefinite"/>
  </circle>

  <!-- Right Decoration -->
  <circle cx="1160" cy="160" r="5" fill="#38BDF8">
    <animate attributeName="opacity"
             values=".3;1;.3"
             dur="2.5s"
             repeatCount="indefinite"/>
  </circle>

  <!-- Name -->
  <text
      x="640"
      y="145"
      text-anchor="middle"
      font-size="60"
      font-family="Inter, Segoe UI, sans-serif"
      font-weight="700"
      fill="#FFFFFF"
      filter="url(#glow)">

      JIHAD SOYON

  </text>

  <!-- Title -->
  <text
      x="640"
      y="185"
      text-anchor="middle"
      font-size="23"
      font-family="Inter, Segoe UI, sans-serif"
      fill="#38BDF8">

      Full Stack Developer

  </text>

  <!-- Stack -->
  <text
      x="640"
      y="220"
      text-anchor="middle"
      font-size="18"
      font-family="Consolas, monospace"
      fill="#C9D1D9">

      Next.js • React • Express • MongoDB • PostgreSQL

  </text>

</svg>