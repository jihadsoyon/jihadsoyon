<svg width="100%" height="280" viewBox="0 0 1200 280" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F2027"/>
      <stop offset="50%" stop-color="#203A43"/>
      <stop offset="100%" stop-color="#2C5364"/>
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#ffffff"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="-1 0" to="1 0" dur="3.5s" repeatCount="indefinite"/>
    </linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#38BDF8" stroke-width="0.5" opacity="0.14"/>
    </pattern>
  </defs>

  <rect width="1200" height="280" fill="url(#bg)"/>
  <rect width="1200" height="280" fill="url(#grid)"/>
  <rect width="1200" height="280" fill="none" stroke="#38BDF8" stroke-opacity="0.35" stroke-width="2"/>

  <text x="70" y="95" font-family="Fira Code, monospace" font-size="54" fill="#38BDF8" opacity="0.18">&lt;/&gt;</text>
  <animateTransform xlink:href="#tag1" attributeName="transform" type="translate" values="0,0; 0,-8; 0,0" dur="3s" repeatCount="indefinite"/>

  <text x="1060" y="225" font-family="Fira Code, monospace" font-size="54" fill="#38BDF8" opacity="0.18">{ }</text>

  <text x="600" y="128" text-anchor="middle" font-family="Fira Code, Consolas, monospace" font-weight="800" font-size="56" fill="url(#shine)" letter-spacing="2">
    JIHAD SOYON
  </text>

  <g>
    <text x="600" y="172" text-anchor="middle" font-family="Fira Code, monospace" font-size="21" fill="#7DD3FC">
      Full Stack Developer
    </text>
    <rect x="742" y="155" width="11" height="22" fill="#38BDF8">
      <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.45;0.5;0.95;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>
  </g>

  <line x1="380" y1="205" x2="820" y2="205" stroke="#38BDF8" stroke-width="1" opacity="0.4"/>

  <text x="600" y="235" text-anchor="middle" font-family="Fira Code, monospace" font-size="15" letter-spacing="1" fill="#8AB4C8">
    NEXT.JS &#8226; EXPRESS &#8226; MONGODB &#8226; ALWAYS-LATEST-STACK
  </text>

  <circle cx="200" cy="235" r="4" fill="#38BDF8">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="1.8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1000" cy="235" r="4" fill="#38BDF8">
    <animate attributeName="opacity" values="1;0.3;1" dur="1.8s" repeatCount="indefinite"/>
  </circle>

  <rect x="0" y="274" width="1200" height="6" fill="#38BDF8" opacity="0.55"/>
</svg>
