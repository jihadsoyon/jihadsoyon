name: generate snake animation

on:
  schedule:
    - cron: "0 */12 * * *"   # regenerate every 12 hours
  workflow_dispatch: {}       # allows manual run from the Actions tab
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: generate snake svg
        uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: jihadsoyon
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#EC4899&color_dots=#0D1B2A,#3A86FF,#8338EC,#FF006E,#FFBE0B
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#00F5FF&color_dots=#161B22,#00F5FF,#7C3AED,#EC4899,#FACC15

      - name: push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
